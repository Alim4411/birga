<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет специалиста — Биржа</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:#f4f5f7;color:#222;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:20px 16px;border-radius:0 0 16px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:22px}
.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;background:#4f46e5;color:#fff;margin-top:10px}
.btn.sec{background:#eef0ff;color:#4f46e5}
.btn.dgr{background:#fee2e2;color:#b91c1c}
.btn.wt{background:#fff;color:#4f46e5}
.btn:active{transform:scale(.97)}
.card{background:#fff;border-radius:12px;padding:16px;margin-top:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d7d9e0;border-radius:8px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid #4f46e5}
.row2{display:flex;gap:10px}
.row2>div{flex:1}
.err{color:#b91c1c;font-size:13px;margin-top:8px;display:none}
.ok{color:#065f46;font-size:13px;margin-top:8px;display:none}
.bk{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
.bk b{font-size:15px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;margin-left:6px}
.t-pending{background:#fef3c7;color:#92400e}
.t-confirmed{background:#d1fae5;color:#065f46}
.t-cancelled{background:#fee2e2;color:#991b1b}
.t-done{background:#e0e7ff;color:#3730a3}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tab{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#e5e7eb;font-size:14px}
.tab.on{background:#4f46e5;color:#fff}
.empty{color:#777;font-size:14px;text-align:center;padding:14px 0}
.hidden{display:none}
.note{font-size:13px;color:#666;margin-top:6px}
a{color:#4f46e5}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
<header><div class="wrap" style="width:100%"><h1>🔐 Кабинет специалиста</h1></div></header>
<div class="wrap">
  <div class="card">
    <h3>Вход</h3>
    <label>Выберите аккаунт</label>
    <select id="accSel"></select>
    <label>Пароль</label>
    <input id="accPass" type="password" placeholder="Пароль">
    <div class="err" id="logErr">Неверный пароль</div>
    <button class="btn" onclick="login()">Войти</button>
    <button class="btn sec" onclick="toggleReg()">Зарегистрироваться</button>
    <button class="btn sec" onclick="adminLogin()">Войти как администратор</button>
    <p class="note"><a href="index.html">← Сайт для клиентов</a></p>
  </div>

  <div class="card hidden" id="regCard">
    <h3>Регистрация специалиста</h3>
    <p class="note">Заявка попадёт на проверку администратору, после одобрения аккаунт появится в списке входа.</p>
    <label>Имя и фамилия / название салона</label><input id="rgName" placeholder="Например: Иса Евлоев">
    <div class="row2">
      <div><label>Категория</label><select id="rgCat"><option>Красота</option><option>Ремонт</option><option>Уборка</option><option>Обучение</option><option>Другое</option></select></div>
      <div><label>Город</label><select id="rgCity"><option>Назрань</option><option>Магас</option><option>Карабулак</option><option>Малгобек</option><option>Сунжа</option></select></div>
    </div>
    <label>О себе</label><textarea id="rgAbout" rows="2" placeholder="Опыт, чем помогаете…"></textarea>
    <label>Услуги (каждая с новой строки: Название — цена)</label>
    <textarea id="rgSvc" rows="3" placeholder="Стрижка — 500&#10;Маникюр — 800"></textarea>
    <div class="row2">
      <div><label>Придумайте пароль (мин. 4 символа)</label><input id="rgPass1" type="password"></div>
      <div><label>Повторите пароль</label><input id="rgPass2" type="password"></div>
    </div>
    <div class="err" id="regErr"></div>
    <button class="btn" onclick="register()">Отправить заявку</button>
  </div>
</div>
</div>

<!-- ЭКРАН КАБИНЕТА -->
<div id="cabScreen" class="hidden">
<header>
  <div class="wrap" style="width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <h1 id="cabName">Кабинет</h1>
    <button class="btn wt" onclick="logout()">Выйти</button>
  </div>
</header>
<div class="wrap">
  <div class="tabs" id="tabsBox"></div>
  <div id="tabBody"></div>
  <p class="note" style="margin-top:16px"><a href="index.html">← Сайт для клиентов</a></p>
</div>
</div>

<script>
function SP(){try{return JSON.parse(localStorage.getItem('birga_specs')||'[]')}catch(e){return[]}}
function BK(){try{return JSON.parse(localStorage.getItem('birga_bookings')||'[]')}catch(e){return[]}}
function RV(){try{return JSON.parse(localStorage.getItem('birga_reviews')||'[]')}catch(e){return[]}}
function saveSP(a){localStorage.setItem('birga_specs',JSON.stringify(a))}
function saveBK(a){localStorage.setItem('birga_bookings',JSON.stringify(a))}
function saveRV(a){localStorage.setItem('birga_reviews',JSON.stringify(a))}
function seed(){
  if(localStorage.getItem('birga_specs'))return;
  saveSP([
    {id:'s1',name:'Марьям Аушева',cat:'Красота',city:'Назрань',about:'Парикмахер-стилист, 5 лет опыта.',services:[{n:'Стрижка',p:500},{n:'Маникюр',p:800},{n:'Макияж',p:1500}],pass:'1111',approved:true},
    {id:'s2',name:'Салон «Красота»',cat:'Красота',city:'Магас',about:'Салон полного цикла.',services:[{n:'Стрижка',p:700},{n:'Окрашивание',p:2000}],pass:'2222',approved:true},
    {id:'s3',name:'Ахмед Евлоев',cat:'Ремонт',city:'Назрань',about:'Сантехника, электрика, мебель.',services:[{n:'Сантехника',p:1000},{n:'Электрика',p:1200},{n:'Сборка мебели',p:800}],pass:'3333',approved:true},
    {id:'s4',name:'Фатима Цориева',cat:'Обучение',city:'Карабулак',about:'Репетитор: английский и математика.',services:[{n:'Английский (час)',p:600},{n:'Математика (час)',p:500}],pass:'4444',approved:true},
    {id:'s5',name:'Мастер Иса',cat:'Ремонт',city:'Сунжа',about:'Ремонт телефонов и замков.',services:[{n:'Ремонт телефона',p:1000},{n:'Установка замка',p:900}],pass:'5555',approved:true},
    {id:'s6',name:'Химчистка «Чисто»',cat:'Уборка',city:'Магас',about:'Химчистка мебели на дому.',services:[{n:'Химчистка дивана',p:1500},{n:'Уборка квартиры',p:2500}],pass:'6666',approved:true}
  ]);
  saveRV([
    {id:'r1',specId:'s1',stars:5,text:'Очень аккуратная стрижка!',name:'Лейла',surname:'Барахоева',phone:'89001112233'},
    {id:'r2',specId:'s3',stars:5,text:'Починил кран за час.',name:'Магомед',surname:'Цечоев',phone:'89004445566'},
    {id:'r3',specId:'s4',stars:4,text:'Хорошие объяснения.',name:'Аминат',surname:'Гагиева',phone:'89007778899'},
    {id:'r4',specId:'s6',stars:5,text:'Диван как новый!',name:'Хава',surname:'Евлоева',phone:'89001234567'}
  ]);
}
seed();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var me=null,curTab='req';

function fillAcc(){
  document.getElementById('accSel').innerHTML=SP().filter(function(s){return s.approved})
    .map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('');
}
function toggleReg(){document.getElementById('regCard').classList.toggle('hidden')}
function showErr(id,m){var e=document.getElementById(id);e.textContent=m;e.style.display='block'}

function login(){
  var sp=SP().find(function(s){return s.id===document.getElementById('accSel').value});
  var p=document.getElementById('accPass').value;
  if(!sp||p!==sp.pass){showErr('logErr','Неверный пароль');return}
  me=sp.id;localStorage.setItem('birga_sess',sp.id);enterCabinet();
}
function adminLogin(){
  var p=prompt('Пароль администратора:');
  if(p==='birga2026'){me='admin';localStorage.setItem('birga_sess','admin');enterCabinet()}
}
function logout(){me=null;localStorage.removeItem('birga_sess');location.reload()}
function enterCabinet(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('cabScreen').classList.remove('hidden');
  document.getElementById('cabName').textContent=me==='admin'?'Кабинет администратора':'Кабинет: '+(SP().find(function(s){return s.id===me})||{}).name;
  renderTabs();openTab('req');
}
function renderTabs(){
  var t=me==='admin'
    ?[['req','Модерация'],['all','Все записи'],['rv','Отзывы'],['adm','Управление']]
    :[['req','Заявки'],['all','Мои записи'],['rv','Отзывы'],['prof','Профиль']];
  document.getElementById('tabsBox').innerHTML=t.map(function(x){
    return '<button class="tab'+(curTab===x[0]?' on':'')+'" onclick="openTab(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function openTab(t){
  curTab=t;renderTabs();
  if(t==='req')tabReq();
  else if(t==='all')tabAll();
  else if(t==='rv')tabRv();
  else if(t==='prof')tabProf();
  else if(t==='adm')tabAdm();
}
var TAGS={pending:'Ожидает подтверждения',confirmed:'Подтверждена',cancelled:'Отменена',done:'Завершена'};
function bkCard(b,btns){
  var sp=SP().find(function(s){return s.id===b.specId})||{name:'?'};
  return '<div class="bk"><b>'+esc(sp.name)+'</b><span class="tag t-'+b.status+'">'+TAGS[b.status]+'</span><br>'+
    'Клиент: '+esc(b.name)+' '+esc(b.surname)+' · тел. <a href="tel:+7'+b.phone.slice(1)+'">'+b.phone+'</a><br>'+
    esc(b.service)+' · '+b.date+' в '+b.time+' · '+b.price+' ₽'+btns+'</div>';
}

function tabReq(){
  var list=BK().filter(function(b){return me!=='admin'&&b.specId===me&&b.status==='pending'});
  document.getElementById('tabBody').innerHTML=list.length
    ?list.map(function(b){return bkCard(b,'<br><button class="btn" onclick="setStatus(\''+b.id+'\',\'confirmed\')">Подтвердить</button> <button class="btn dgr" onclick="setStatus(\''+b.id+'\',\'cancelled\')">Отменить</button>')}).join('')
    :'<div class="empty">Новых заявок нет</div>';
}
function tabAll(){
  var list=BK().filter(function(b){return me==='admin'||b.specId===me}).sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time)});
  document.getElementById('tabBody').innerHTML=list.length
    ?list.map(function(b){
      var btns='';
      if(b.status==='pending')btns='<br><button class="btn" onclick="setStatus(\''+b.id+'\',\'confirmed\')">Подтвердить</button> <button class="btn dgr" onclick="setStatus(\''+b.id+'\',\'cancelled\')">Отменить</button>';
      else if(b.status==='confirmed')btns='<br><button class="btn" onclick="setStatus(\''+b.id+'\',\'done\')">Визит состоялся</button> <button class="btn dgr" onclick="setStatus(\''+b.id+'\',\'cancelled\')">Отменить</button>';
      return bkCard(b,btns);
    }).join('')
    :'<div class="empty">Записей пока нет</div>';
}
function tabRv(){
  var list=RV().filter(function(r){return me==='admin'||r.specId===me});
  document.getElementById('tabBody').innerHTML=list.length
    ?list.map(function(r){
      var sp=SP().find(function(s){return s.id===r.specId})||{name:'?'};
      var del=me==='admin'||r.specId===me?' <button class="btn dgr" onclick="delRv(\''+r.id+'\')">Удалить</button>':'';
      return '<div class="bk"><b>'+esc(sp.name)+'</b> · '+'★'.repeat(r.stars)+'☆'.repeat(5-r.stars)+del+'<br>'+esc(r.text)+'<br><span style="color:#777">'+esc(r.name)+' '+esc(r.surname)+'</span></div>';
    }).join('')
    :'<div class="empty">Отзывов пока нет</div>';
}
function tabProf(){
  var sp=SP().find(function(s){return s.id===me});
  document.getElementById('tabBody').innerHTML=
    '<div class="card"><h3>Профиль</h3>'+
    '<label>Имя / название</label><input id="pfName" value="'+esc(sp.name)+'">'+
    '<div class="row2"><div><label>Категория</label><select id="pfCat">'+['Красота','Ремонт','Уборка','Обучение','Другое'].map(function(c){return '<option'+(sp.cat===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div>'+
    '<div><label>Город</label><select id="pfCity">'+['Назрань','Магас','Карабулак','Малгобек','Сунжа'].map(function(c){return '<option'+(sp.city===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div></div>'+
    '<label>О себе</label><textarea id="pfAbout" rows="2">'+esc(sp.about||'')+'</textarea>'+
    '<label>Услуги (Название — цена, каждая с новой строки)</label><textarea id="pfSvc" rows="4">'+esc(sp.services.map(function(v){return v.n+' — '+v.p}).join('\n'))+'</textarea>'+
    '<div class="ok" id="pfOk">Сохранено!</div>'+
    '<button class="btn" onclick="saveProf()">Сохранить профиль</button>'+
    '<hr style="margin:18px 0;border:0;border-top:1px solid #e5e7eb">'+
    '<h3>Сменить пароль</h3>'+
    '<div class="row2"><div><label>Новый пароль</label><input id="pfP1" type="password"></div><div><label>Повторите</label><input id="pfP2" type="password"></div></div>'+
    '<div class="err" id="pfErr"></div><div class="ok" id="pfOk2">Пароль изменён!</div>'+
    '<button class="btn" onclick="changePass()">Сменить пароль</button></div>';
}
function saveProf(){
  var all=SP(),sp=all.find(function(s){return s.id===me});
  var svc=document.getElementById('pfSvc').value.split('\n').map(function(l){var p=l.split('—');return p.length===2?{n:p[0].trim(),p:+(p[1].replace(/\D/g,'')||0)}:null}).filter(Boolean);
  if(!svc.length){showErr('pfErr','Укажите хотя бы одну услугу в формате «Название — цена»');return}
  sp.name=document.getElementById('pfName').value.trim()||sp.name;
  sp.cat=document.getElementById('pfCat').value;sp.city=document.getElementById('pfCity').value;
  sp.about=document.getElementById('pfAbout').value.trim();sp.services=svc;
  saveSP(all);document.getElementById('pfErr').style.display='none';document.getElementById('pfOk').style.display='block';
}
function changePass(){
  var p1=document.getElementById('pfP1').value,p2=document.getElementById('pfP2').value;
  if(p1.length<4){showErr('pfErr','Пароль минимум 4 символа');return}
  if(p1!==p2){showErr('pfErr','Пароли не совпадают');return}
  var all=SP();all.find(function(s){return s.id===me}).pass=p1;saveSP(all);
  document.getElementById('pfErr').style.display='none';document.getElementById('pfOk2').style.display='block';
}
function tabAdm(){
  var pend=SP().filter(function(s){return !s.approved});
  document.getElementById('tabBody').innerHTML=
    '<div class="card"><h3>Заявки на регистрацию ('+pend.length+')</h3>'+
    (pend.length?pend.map(function(s){
      return '<div class="bk"><b>'+esc(s.name)+'</b> · '+esc(s.cat)+' · '+esc(s.city)+'<br>'+esc(s.about||'')+'<br>'+
      s.services.map(function(v){return esc(v.n)+' — '+v.p+' ₽'}).join(', ')+
      '<br><button class="btn" onclick="approve(\''+s.id+'\')">Одобрить</button> <button class="btn dgr" onclick="delSpec(\''+s.id+'\')">Удалить</button></div>';
    }).join(''):'<div class="empty">Новых заявок нет</div>')+
    '</div>'+
    '<div class="card"><h3>Сброс демо-данных</h3><p class="note">Удалит все записи, отзывы и новых специалистов, вернёт 6 демо-аккаунтов.</p>'+
    '<button class="btn dgr" onclick="resetAll()">Сбросить демо-данные</button></div>';
}
function setStatus(id,st){var bk=BK(),b=bk.find(function(x){return x.id===id});if(b){b.status=st;saveBK(bk);openTab(curTab)}}
function delRv(id){saveRV(RV().filter(function(r){return r.id!==id}));openTab('rv')}
function approve(id){var all=SP();all.find(function(s){return s.id===id}).approved=true;saveSP(all);openTab('adm');fillAcc()}
function delSpec(id){saveSP(SP().filter(function(s){return s.id!==id}));openTab('adm');fillAcc()}
function resetAll(){
  if(!confirm('Сбросить все данные и вернуть демо-версию?'))return;
  localStorage.removeItem('birga_specs');localStorage.removeItem('birga_bookings');localStorage.removeItem('birga_reviews');
  seed();alert('Данные сброшены');enterCabinet();
}
function register(){
  var n=document.getElementById('rgName').value.trim();
  var p1=document.getElementById('rgPass1').value,p2=document.getElementById('rgPass2').value;
  var svc=document.getElementById('rgSvc').value.split('\n').map(function(l){var p=l.split('—');return p.length===2?{n:p[0].trim(),p:+(p[1].replace(/\D/g,'')||0)}:null}).filter(Boolean);
  if(n.length<3){showErr('regErr','Укажите имя (минимум 3 символа)');return}
  if(!svc.length){showErr('regErr','Укажите хотя бы одну услугу в формате «Название — цена»');return}
  if(p1.length<4){showErr('regErr','Пароль минимум 4 символа');return}
  if(p1!==p2){showErr('regErr','Пароли не совпадают');return}
  var all=SP();
  all.push({id:'s'+Date.now(),name:n,cat:document.getElementById('rgCat').value,city:document.getElementById('rgCity').value,about:document.getElementById('rgAbout').value.trim(),services:svc,pass:p1,approved:false});
  saveSP(all);fillAcc();
  document.getElementById('regCard').classList.add('hidden');
  alert('Заявка отправлена! После одобрения администратором войдите со своим паролем.');
}

var sess=localStorage.getItem('birga_sess');
fillAcc();
if(sess==='admin'){me='admin';enterCabinet()}
else if(sess&&SP().find(function(s){return s.id===sess&&s.approved})){me=sess;enterCabinet()}
</script>
</body>
</html>
