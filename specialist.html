<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birga — кабинет специалиста</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1c2333;--muted:#6b7280;--accent:#3b5bfd;--accent2:#eef1ff;--border:#e5e9f2;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:var(--bg);color:var(--text)}
main{max-width:800px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin:20px 0}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;width:100%}
.btn.ghost{background:var(--accent2);color:var(--accent)}
.btn.small{width:auto;padding:6px 12px;font-size:13px}
.btn.danger{background:#fde8e8;color:var(--danger)}
input,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
h1{font-size:22px;margin:20px 0 4px}
h3{margin-bottom:10px}
.err{color:var(--danger);font-size:13px;min-height:16px;margin-top:6px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;position:relative}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{position:absolute;top:-7px;right:-7px;background:#dc2626;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.appt{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.st{font-size:12px;padding:2px 8px;border-radius:8px;display:inline-block}
.st.new{background:#fff7e6;color:var(--warn)}
.st.conf{background:#e8f7ee;color:var(--ok)}
.st.done{background:#e7f0ff;color:var(--accent)}
.st.canc{background:#fde8e8;color:var(--danger)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--border);padding:8px 6px;text-align:left}
.wd{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.wd .w{border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.wd .w.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.svcrow{display:flex;gap:6px;margin-bottom:6px}
.svcrow input{flex:1}
.svcrow .n{width:45%}
</style>
</head>
<body>
<main>
<!-- ЭКРАН ВХОДА -->
<div class="card" id="loginBox">
<h1>Кабинет специалиста</h1>
<label>Аккаунт</label>
<select id="acc"></select>
<label>Пароль</label>
<input id="pwd" type="password" placeholder="Пароль">
<div class="err" id="lErr"></div>
<button class="btn" onclick="login()">Войти</button>
<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
<button class="btn ghost" onclick="openReg()">Зарегистрироваться как мастер</button>
<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
<label>Администратор</label>
<input id="apwd" type="password" placeholder="Пароль администратора">
<div style="margin-top:8px"><button class="btn ghost" onclick="loginAdmin()">Войти как администратор</button></div>
<p class="sub" style="margin-top:14px">Демо-пароли: Ахмед — 1111, Марьям — 2222, Муса — 3333, Лейла — 4444, Ислам — 5555, Фатима — 6666, админ — birga2026</p>
</div>

<!-- ЭКРАН РЕГИСТРАЦИИ -->
<div class="card hidden" id="regBox">
<h1>Заявка на регистрацию</h1>
<label>Имя и фамилия *</label><input id="rName" placeholder="Например: Ахмед Евлоев">
<label>Категория *</label><input id="rCat" placeholder="Например: Ногти, Барбер">
<label>Город *</label><input id="rCity" placeholder="Например: Назрань">
<label>Телефон *</label><input id="rPhone" placeholder="8960…">
<label>Придумайте пароль *</label><input id="rPwd" type="password">
<div class="err" id="rErr"></div>
<div class="row" style="margin-top:12px">
<button class="btn ghost small" onclick="backLogin()">Назад</button>
<button class="btn small" onclick="sendReg()">Отправить заявку</button>
</div>
</div>

<!-- ПАНЕЛЬ МАСТЕРА -->
<div id="panel" class="hidden">
<h1 id="ph1">Кабинет</h1>
<div class="tabs">
<button class="tab on" id="tabB" onclick="showTab('b')">Записи</button>
<button class="tab" onclick="showTab('p')">Профиль</button>
<button class="btn small ghost" style="margin-left:auto" onclick="logout()">Выйти</button>
</div>
<div id="tabB" class="tabc"></div>
<div id="tabP" class="tabc hidden">
<div class="card">
<h3>Профиль</h3>
<label>Имя и фамилия</label><input id="pName">
<label>Категория</label><input id="pCat">
<label>Город</label><input id="pCity">
<label>Телефон</label><input id="pPhone">
<label>Рабочие дни (клик — вкл/выкл)</label>
<div class="wd" id="pWd"></div>
<label>Мои услуги (название + цена от/до)</label>
<div id="pSvcs"></div>
<button class="btn small ghost" onclick="addSvcRow()">+ Добавить услугу</button>
<hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
<label>Сменить пароль</label><input id="pPwd" type="password" placeholder="Новый пароль">
<div class="row" style="margin-top:10px"><button class="btn small" onclick="saveProfile()">Сохранить</button></div>
<div class="err" id="pMsg"></div>
</div>
</div>
</div>

<!-- ПАНЕЛЬ АДМИНА -->
<div id="apanel" class="hidden">
<h1>Админ-панель</h1>
<div class="tabs">
<button class="tab on" id="atS" onclick="showAdminTab('s')">Специалисты</button>
<button class="tab" id="atR" onclick="showAdminTab('r')">Заявки</button>
<button class="tab" id="atB" onclick="showAdminTab('b')">Все записи</button>
<button class="btn small ghost" style="margin-left:auto" onclick="logout()">Выйти</button>
</div>
<div id="atabS"></div>
<div id="atabR" class="hidden"></div>
<div id="atabB" class="hidden"></div>
<div class="row"><button class="btn small danger" onclick="resetAll()">Сбросить демо-данные</button></div>
</div>
</main>
<script>
var DEF_MASTERS=[
{id:1,name:"Ахмед Евлоев",cat:"Барбер",city:"Назрань",phone:"89600000001",pwd:"1111",works:["Пн","Вт","Ср","Чт","Пт"],services:[{n:"Стрижка",p1:500,p2:800},{n:"Борода",p1:300,p2:500}],approved:true},
{id:2,name:"Марьям Магомедова",cat:"Ногти",city:"Назрань",phone:"89600000002",pwd:"2222",works:["Пн","Вт","Ср","Чт","Сб"],services:[{n:"Маникюр",p1:600,p2:1000},{n:"Гель-лак",p1:800,p2:1200}],approved:true},
{id:3,name:"Муса Цечоев",cat:"Барбер",city:"Магас",phone:"89600000003",pwd:"3333",works:["Вт","Ср","Чт","Сб","Вс"],services:[{n:"Мужская стрижка",p1:400,p2:700},{n:"Камуфляж седины",p1:500,p2:700}],approved:true},
{id:4,name:"Лейла Барахоева",cat:"Брови/Ресницы",city:"Назрань",phone:"89600000004",pwd:"4444",works:["Пн","Ср","Пт","Сб"],services:[{n:"Коррекция бровей",p1:400,p2:600},{n:"Ламинирование",p1:1200,p2:1800}],approved:true},
{id:5,name:"Ислам Озиев",cat:"Ремонт",city:"Назрань",phone:"89600000005",pwd:"5555",works:["Пн","Вт","Ср","Чт","Пт","Сб"],services:[{n:"Диагностика ПК",p1:500,p2:800},{n:"Установка Windows",p1:700,p2:1000}],approved:true},
{id:6,name:"Фатима Гандалоева",cat:"Ногти",city:"Карабулак",phone:"89600000006",pwd:"6666",works:["Вт","Чт","Пт","Сб","Вс"],services:[{n:"Педикюр",p1:700,p2:1100},{n:"Наращивание",p1:1500,p2:2500}],approved:true}
];
var MASTERS=JSON.parse(localStorage.getItem("b_masters")||"null");
if(!MASTERS){MASTERS=JSON.parse(JSON.stringify(DEF_MASTERS));localStorage.setItem("b_masters",JSON.stringify(MASTERS));}
var BOOKINGS=JSON.parse(localStorage.getItem("b_bookings")||"[]");
var REVIEWS=JSON.parse(localStorage.getItem("b_reviews")||"{}");
var USERS=JSON.parse(localStorage.getItem("b_users")||"{}");
var REQ=JSON.parse(localStorage.getItem("b_requests")||"[]");
var SEEN=JSON.parse(localStorage.getItem("b_seen")||"{}");
function saveAll(){localStorage.setItem("b_masters",JSON.stringify(MASTERS));localStorage.setItem("b_bookings",JSON.stringify(BOOKINGS));localStorage.setItem("b_reviews",JSON.stringify(REVIEWS));localStorage.setItem("b_users",JSON.stringify(USERS));localStorage.setItem("b_requests",JSON.stringify(REQ));localStorage.setItem("b_seen",JSON.stringify(SEEN));}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// ---------- вход ----------
function fillAcc(){
var sel=document.getElementById("acc");
sel.innerHTML='<option value="">— выберите аккаунт —</option>'+MASTERS.filter(function(m){return m.approved}).map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+" · "+esc(m.cat)+"</option>"}).join("");}
fillAcc();
function login(){
var id=+document.getElementById("acc").value,pw=document.getElementById("pwd").value;
if(!id){document.getElementById("lErr").textContent="Выберите аккаунт из списка.";return;}
var m=MASTERS.filter(function(x){return x.id===id})[0];
if(m.pwd!==pw){document.getElementById("lErr").textContent="Неверный пароль. Попробуйте ещё раз.";return;}
document.getElementById("lErr").textContent="";
curM=m;showPanel();}
function loginAdmin(){
if(document.getElementById("apwd").value!=="birga2026"){document.getElementById("lErr").textContent="Неверный пароль администратора.";return;}
document.getElementById("lErr").textContent="";
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("apanel").classList.remove("hidden");
showAdminTab('s');}
function logout(){location.reload();}
function backLogin(){document.getElementById("regBox").classList.add("hidden");document.getElementById("loginBox").classList.remove("hidden");}
function openReg(){document.getElementById("loginBox").classList.add("hidden");document.getElementById("regBox").classList.remove("hidden");}
function sendReg(){
var n=document.getElementById("rName").value.trim(),c=document.getElementById("rCat").value.trim(),ci=document.getElementById("rCity").value.trim(),ph=document.getElementById("rPhone").value.replace(/\D/g,""),pw=document.getElementById("rPwd").value;
var e="";if(n.split(" ").length<2)e+="Укажите имя и фамилию. ";if(!c)e+="Укажите категорию. ";if(!ci)e+="Укажите город. ";if(ph.length<10)e+="Телефон 10–11 цифр. ";if(pw.length<4)e+="Пароль от 4 символов.";
if(e){document.getElementById("rErr").textContent=e.trim();return;}
REQ.push({name:n,cat:c,city:ci,phone:ph,pwd:pw});saveAll();
document.getElementById("regBox").innerHTML='<h1>Заявка отправлена ✅</h1><p class="sub">Администратор одобрит её, и вы появитсяесь в каталоге.</p><div class="row"><button class="btn small" onclick="location.reload()">На главную</button></div>';}

// ---------- панель мастера ----------
var curM=null,curTab='b';
function showPanel(){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");
document.getElementById("ph1").textContent="Кабинет: "+curM.name;
drawTab();}
function showTab(t){curTab=t;
document.getElementById("tabB").classList.toggle("on",t==="b");
document.querySelector(".tab[onclick=\"showTab('p')\"]").classList.toggle("on",t==="p");
document.getElementById("tabB").classList.toggle("hidden",t!=="b");
document.getElementById("tabP").classList.toggle("hidden",t!=="p");
if(t==="b"){SEEN[curM.id]=true;saveAll();}drawTab();}
function drawTab(){
if(curTab!=="b"){drawProfile();return;}
var list=BOOKINGS.filter(function(b){return b.mid===curM.id}).slice().reverse();
var cnt=BOOKINGS.filter(function(b){return b.mid===curM.id&&b.status==="новая"&&!b.cancelled}).length;
document.getElementById("tabB").innerHTML=(cnt?'<p class="sub" style="color:var(--danger)">Новых записей: '+cnt+'</p>':"")+(list.length?"":'<div class="card">Пока нет записей.</div>');
list.forEach(function(b){
var idx=BOOKINGS.indexOf(b);
var st=b.cancelled?'<span class="st canc">отменена клиентом</span>':b.status==="новая"?'<span class="st new">новая</span>':b.status==="подтверждена"?'<span class="st conf">подтверждена</span>':'<span class="st done">завершена</span>';
var html='<div class="appt"><b>'+esc(b.fn)+" "+esc(b.ln)+'</b> <span class="sub">'+esc(b.ph)+"</span> "+st+'<div class="sub">'+esc(b.svc)+" ("+b.p1+"–"+b.p2+" ₽) · "+b.date+" в "+b.time+(b.paid?" · 💳 оплачено онлайн (демо)":" · оплата на месте")+'</div>';
if(!b.cancelled&&b.status==="новая")html+='<div class="row"><button class="btn small" onclick="setStatus('+idx+',\'подтверждена\')">Подтвердить</button><button class="btn small danger" onclick="setStatus('+idx+',\'отменена\')">Отклонить</button></div>';
if(b.status==="подтверждена")html+='<div class="row"><button class="btn small" onclick="setStatus('+idx+',\'завершена\')">Завершить</button></div>';
html+="</div>";document.getElementById("tabB").insertAdjacentHTML("beforeend",html);});}
function setStatus(i,s){BOOKINGS[i].status=s;if(s==="отменена")BOOKINGS[i].cancelled=true;saveAll();drawTab();}
function drawProfile(){
var m=curM;
document.getElementById("pName").value=m.name;document.getElementById("pCat").value=m.cat;
document.getElementById("pCity").value=m.city;document.getElementById("pPhone").value=m.phone;
var wd=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
document.getElementById("pWd").innerHTML=wd.map(function(d){return '<div class="w'+(m.works.includes(d)?" on":"")+'" onclick="toggleWd(\''+d+'\')">'+d+"</div>"}).join("");
var h="";m.services.forEach(function(s,i){h+='<div class="svcrow"><input class="n" value="'+esc(s.n)+'" onchange="updSvc('+i+',\'n\',this.value)"><input type="number" value="'+s.p1+'" onchange="updSvc('+i+',\'p1\',this.value)"><input type="number" value="'+s.p2+'" onchange="updSvc('+i+',\'p2\',this.value)"><button class="btn small danger" onclick="delSvc('+i+')">✕</button></div>'});
document.getElementById("pSvcs").innerHTML=h;
document.getElementById("pPwd").value="";}
function toggleWd(d){var i=curM.works.indexOf(d);if(i>=0)curM.works.splice(i,1);else curM.works.push(d);saveAll();drawProfile();}
function updSvc(i,k,v){curM.services[i][k]=k==="n"?v:(+v||0);saveAll();}
function delSvc(i){curM.services.splice(i,1);saveAll();drawProfile();}
function addSvcRow(){curM.services.push({n:"Новая услуга",p1:500,p2:1000});saveAll();drawProfile();}
function saveProfile(){
curM.name=document.getElementById("pName").value.trim()||curM.name;
curM.cat=document.getElementById("pCat").value.trim()||curM.cat;
curM.city=document.getElementById("pCity").value.trim()||curM.city;
curM.phone=document.getElementById("pPhone").value.replace(/\D/g,"")||curM.phone;
var pw=document.getElementById("pPwd").value.trim();if(pw)curM.pwd=pw;
saveAll();document.getElementById("pMsg").textContent="✅ Сохранено";document.getElementById("ph1").textContent="Кабинет: "+curM.name;
setTimeout(function(){document.getElementById("pMsg").textContent=""},2000);}

// ---------- админ ----------
function showAdminTab(t){
["s","r","b"].forEach(function(x){document.getElementById("atab"+x.toUpperCase()).classList.toggle("hidden",x!==t);
document.getElementById("at"+x.toUpperCase()).classList.toggle("on",x===t);});
if(t==="s")drawAdmMasters();if(t==="r")drawAdmReqs();if(t==="b")drawAdmBookings();}
function drawAdmMasters(){
var h='<div class="card"><table><tr><th>Мастер</th><th>Категория</th><th>Город</th><th>Телефон</th><th>Услуг</th><th>Рейтинг</th><th>Записи (всего/новых/заверш.)</th><th></th></tr>';
MASTERS.forEach(function(m){
var bl=BOOKINGS.filter(function(b){return b.mid===m.id});
var nw=bl.filter(function(b){return b.status==="новая"&&!b.cancelled}).length,dn=bl.filter(function(b){return b.status==="завершена"}).length;
var r=REVIEWS[m.id];var avg=r?("★"+(r.reduce(function(a,x){return a+x.stars},0)/r.length).toFixed(1)):("—");
h+='<tr><td><b>'+esc(m.name)+'</b></td><td>'+esc(m.cat)+'</td><td>'+esc(m.city)+'</td><td>'+esc(m.phone)+'</td><td>'+m.services.length+'</td><td>'+avg+'</td><td>'+bl.length+"/"+nw+"/"+dn+'</td><td><button class="btn small ghost" onclick="admShow('+m.id+')">Записи</button> <button class="btn small danger" onclick="admDel('+m.id+')">Удалить</button></td></tr>';
if(admOpen===m.id)h+='<tr><td colspan="8">'+(bl.length?'<div style="max-height:220px;overflow:auto">'+bl.map(function(b){return '<div class="appt">'+esc(b.fn)+" "+esc(b.ln)+" · "+esc(b.svc)+" · "+b.date+" "+b.time+" · "+(b.cancelled?'<span class="st canc">отменена</span>':b.status)+(b.paid?" · 💳":"")+"</div>"}).join("")+"</div>":'<p class="sub">Записей нет</p>')+"</td></tr>";});
document.getElementById("atabS").innerHTML=h+"</table></div>";}
var admOpen=0;
function admShow(id){admOpen=admOpen===id?0:id;drawAdmMasters();}
function admDel(id){if(!confirm("Удалить мастера и все его записи?"))return;
MASTERS=MASTERS.filter(function(m){return m.id!==id});
BOOKINGS=BOOKINGS.filter(function(b){return b.mid!==id});delete REVIEWS[id];saveAll();drawAdmMasters();}
function drawAdmReqs(){
document.getElementById("atabR").innerHTML=REQ.length?REQ.map(function(r,i){return '<div class="appt"><b>'+esc(r.name)+'</b> · '+esc(r.cat)+" · "+esc(r.city)+" · "+esc(r.phone)+'<div class="row"><button class="btn small" onclick="approveReq('+i+')">Одобрить</button><button class="btn small danger" onclick="rejectReq('+i+')">Отклонить</button></div></div>'}).join(""):'<div class="card">Новых заявок нет.</div>';}
function approveReq(i){
var r=REQ[i];var nid=MASTERS.reduce(function(a,m){return Math.max(a,m.id)},0)+1;
MASTERS.push({id:nid,name:r.name,cat:r.cat,city:r.city,phone:r.phone,pwd:r.pwd,works:["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],services:[{n:"Услуга 1",p1:500,p2:1000}],approved:true});
REQ.splice(i,1);saveAll();drawAdmReqs();}
function rejectReq(i){REQ.splice(i,1);saveAll();drawAdmReqs();}
function drawAdmBookings(){
var h='<div class="card"><table><tr><th>Клиент</th><th>Мастер</th><th>Услуга</th><th>Дата и время</th><th>Статус</th><th>Оплата</th></tr>';
BOOKINGS.slice().reverse().forEach(function(b){
var m=MASTERS.filter(function(x){return x.id===b.mid})[0];
var st=b.cancelled?'<span class="st canc">отменена</span>':b.status==="новая"?'<span class="st new">новая</span>':b.status==="подтверждена"?'<span class="st conf">подтверждена</span>':'<span class="st done">завершена</span>';
h+='<tr><td>'+esc(b.fn)+" "+esc(b.ln)+"<br><span class='sub'>"+esc(b.ph)+"</span></td><td>"+(m?esc(m.name):"—")+'</td><td>'+esc(b.svc)+'</td><td>'+b.date+" "+b.time+"</td><td>"+st+"</td><td>"+(b.paid?"💳 онлайн":"на месте")+"</td></tr>";});
document.getElementById("atabB").innerHTML=BOOKINGS.length?h+"</table></div>":'<div class="card">Записей пока нет.</div>';}
function resetAll(){
if(!confirm("Удалить все записи, отзывы и заявки и вернуть мастеров к исходным?"))return;
localStorage.removeItem("b_bookings");localStorage.removeItem("b_reviews");localStorage.removeItem("b_requests");
localStorage.removeItem("b_masters");localStorage.removeItem("b_users");
MASTERS=JSON.parse(JSON.stringify(DEF_MASTERS));BOOKINGS=[];REVIEWS={};USERS={};REQ=[];
saveAll();showAdminTab('s');}
</script>
</body>
</html>
