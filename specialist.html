<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БИРГА — кабинет специалиста</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1c2333;--mut:#69738a;--acc:#4f6ef7;--line:#e3e7f2;--ok:#1a9b57;--bad:#d84f4f}
body.dark{--bg:#12151f;--card:#1c2130;--text:#eef1f8;--mut:#9aa3ba;--line:#2a3044}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 0;position:sticky;top:0;z-index:50}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:1px;color:var(--acc)}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button.big{width:100%;padding:12px}
button:active{transform:scale(.98)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.login{max-width:420px;margin:40px auto}
h1{font-size:24px;margin-bottom:6px}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mut);margin-top:12px}
.err{color:var(--bad);font-size:14px;margin-top:8px;display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tab{padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:600;position:relative}
.tab.act{background:var(--acc);color:#fff;border-color:var(--acc)}
.badge{position:absolute;top:-7px;right:-7px;background:#d84f4f;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.bktop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600}
.t-new{background:#fff3d6;color:#8a6100}.t-conf{background:#dff5e8;color:#1a6b40}.t-done{background:#e2e8ff;color:#3346c9}.t-can{background:#fde2e2;color:#a11a1a}.t-paid{background:#e6f0ff;color:#1c4fa1}
body.dark .t-new{background:#4a3a10;color:#ffd66b}body.dark .t-conf{background:#143a24;color:#6fe0a0}body.dark .t-done{background:#1e2650;color:#9fb0ff}body.dark .t-can{background:#4a1616;color:#ff9c9c}body.dark .t-paid{background:#16304f;color:#8ec2ff}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.chk{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chk label{display:flex;align-items:center;gap:4px;margin:0;font-size:14px;color:var(--text)}
.chk input{width:auto}
.svcrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
@media(max-width:600px){.svcrow{grid-template-columns:1fr 1fr;}}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat3 div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat3 b{display:block;font-size:20px}
.stat3 span{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header><div class="wrap hrow">
<div class="logo">БИРГА · кабинет</div>
<div class="hrow">
<button class="sec" onclick="refreshAll()">🔄 Обновить</button>
<button class="sec" onclick="document.body.classList.toggle('dark')">🌙</button>
<button class="sec" id="logoutBtn" style="display:none" onclick="logout()">Выйти</button>
</div>
</div></header>

<div class="wrap">
<div class="login card" id="loginCard">
<h1>Кабинет специалиста</h1>
<p class="mut">Выбери свой аккаунт и введи пароль.</p>
<label>Аккаунт</label>
<select id="acc"></select>
<label>Пароль</label>
<input type="password" id="pass" placeholder="Пароль">
<button class="big" style="margin-top:14px" onclick="login()">Войти</button>
<div class="err" id="err"></div>
<div class="hint">Демо-пароли: Ахмед — 1111, Марьям — 2222, Муса — 3333, Лейла — 4444, Ислам — 5555, Фатима — 6666, Зураб — 7777, Амина — 8888, Тимур — 9999, Рукият — 1010</div>
<hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
<label style="margin-top:0">Администратор</label>
<input type="password" id="adminPass" placeholder="Пароль администратора">
<button class="big sec" style="margin-top:10px" onclick="loginAdmin()">Войти как администратор</button>
<div class="err" id="adminErr"></div>
</div>

<div id="app" style="display:none">
<div class="tabs" id="tabs"></div>
<div id="content"></div>
</div>
</div>

<script>
var DB_KEY='birgaDB_v2';
var DEFAULTS={specialists:[
{id:'s1',name:'Ахмед Евлоев',cat:'Барбер',city:'Назрань',phone:'+7 905 111-11-11',rating:4.9,votes:57,pass:'1111',days:[1,2,3,4,5,6],services:[{n:'Мужская стрижка',p1:500,p2:800},{n:'Стрижка + борода',p1:800,p2:1200},{n:'Детская стрижка',p1:350,p2:500}]},
{id:'s2',name:'Марьям Цечоева',cat:'Ногти',city:'Назрань',phone:'+7 905 222-22-22',rating:5.0,votes:83,pass:'2222',days:[1,2,3,4,5,6],services:[{n:'Маникюр',p1:400,p2:700},{n:'Маникюр + гель-лак',p1:700,p2:1100},{n:'Наращивание',p1:1500,p2:2200}]},
{id:'s3',name:'Муса Дзарахов',cat:'Барбер',city:'Магас',phone:'+7 905 333-33-33',rating:4.8,votes:41,pass:'3333',days:[1,2,3,4,5],services:[{n:'Мужская стрижка',p1:600,p2:900},{n:'Камуфляж седины',p1:400,p2:600}]},
{id:'s4',name:'Лейла Оздоева',cat:'Брови/Ресницы',city:'Магас',phone:'+7 905 444-44-44',rating:4.9,votes:64,pass:'4444',days:[2,3,4,5,6],services:[{n:'Ламинирование ресниц',p1:1200,p2:1800},{n:'Коррекция бровей',p1:500,p2:800},{n:'Окрашивание бровей',p1:400,p2:700}]},
{id:'s5',name:'Ислам Картоев',cat:'Ремонт',city:'Карабулак',phone:'+7 905 555-55-55',rating:4.7,votes:29,pass:'5555',days:[1,2,3,4,5,6],services:[{n:'Мелкий бытовой ремонт',p1:500,p2:1000},{n:'Сборка мебели',p1:800,p2:1500},{n:'Установка розеток',p1:400,p2:900}]},
{id:'s6',name:'Фатима Бекова',cat:'Ногти',city:'Магас',phone:'+7 905 666-66-66',rating:4.9,votes:52,pass:'6666',days:[1,2,3,4,5,6],services:[{n:'Маникюр',p1:450,p2:750},{n:'Педикюр',p1:800,p2:1300}]},
{id:'s7',name:'Зураб Полонкоев',cat:'Барбер',city:'Карабулак',phone:'+7 905 777-77-77',rating:4.6,votes:18,pass:'7777',days:[1,3,4,5,6],services:[{n:'Мужская стрижка',p1:400,p2:700},{n:'Оформление бороды',p1:300,p2:500}]},
{id:'s8',name:'Амина Гандиева',cat:'Брови/Ресницы',city:'Назрань',phone:'+7 905 888-88-88',rating:5.0,votes:37,pass:'8888',days:[1,2,4,5,6],services:[{n:'Наращивание ресниц',p1:1500,p2:2500},{n:'Ламинирование ресниц',p1:1100,p2:1700}]},
{id:'s9',name:'Тимур Цуров',cat:'Ремонт',city:'Назрань',phone:'+7 905 999-99-99',rating:4.8,votes:22,pass:'9999',days:[1,2,3,4,5,6],services:[{n:'Сантехника',p1:700,p2:2000},{n:'Электрика',p1:600,p2:1800}]},
{id:'s10',name:'Рукият Барахоева',cat:'Ногти',city:'Карабулак',phone:'+7 905 101-01-01',rating:4.9,votes:31,pass:'1010',days:[2,3,4,5,6],services:[{n:'Маникюр',p1:350,p2:650},{n:'Дизайн ногтей',p1:200,p2:500}]}
],bookings:[],pending:[],reviews:[],seen:[]};

function loadDB(){
  try{
    var d=JSON.parse(localStorage.getItem(DB_KEY));
    if(!d||!d.specialists||!d.specialists.length) throw 0;
    if(!d.bookings)d.bookings=[]; if(!d.pending)d.pending=[]; if(!d.reviews)d.reviews=[]; if(!d.seen)d.seen=[];
    return d;
  }catch(e){
    var d=JSON.parse(JSON.stringify(DEFAULTS));
    localStorage.setItem(DB_KEY,JSON.stringify(d));
    return d;
  }
}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var me=null, meAdmin=false, curTab='bk';

function fillAccounts(){
  var db=loadDB();
  var sel=document.getElementById('acc');
  sel.innerHTML='<option value="">— выберите аккаунт —</option>'+db.specialists.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+' ('+esc(s.cat)+', '+esc(s.city)+') — пароль '+s.pass+'</option>';}).join('');
}
function login(){
  var err=document.getElementById('err');
  function bad(m){err.textContent=m;err.style.display='block';}
  err.style.display='none';
  var id=document.getElementById('acc').value;
  if(!id)return bad('Сначала выбери аккаунт из списка');
  var db=loadDB();var sp=null;
  db.specialists.forEach(function(s){if(s.id===id)sp=s;});
  if(!sp)return bad('Аккаунт не найден');
  if(document.getElementById('pass').value!==sp.pass)return bad('Неверный пароль. Подсказка — в серой рамке ниже.');
  me=sp;meAdmin=false;
  document.getElementById('loginCard').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('logoutBtn').style.display='inline-block';
  curTab='bk';renderTabs();renderTab();
}
function loginAdmin(){
  var err=document.getElementById('adminErr');
  function bad(m){err.textContent=m;err.style.display='block';}
  err.style.display='none';
  if(document.getElementById('adminPass').value!=='birga2026')return bad('Неверный пароль администратора (демо: birga2026)');
  meAdmin=true;me=null;
  document.getElementById('loginCard').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('logoutBtn').style.display='inline-block';
  curTab='specs';renderTabs();renderTab();
}
function logout(){me=null;meAdmin=false;document.getElementById('loginCard').style.display='block';document.getElementById('app').style.display='none';document.getElementById('logoutBtn').style.display='none';fillAccounts();}
function refreshAll(){renderTabs();renderTab();}

function statusTag(b){
  var st={new:'новая',confirmed:'подтверждена',done:'завершена',canceled:'отменена'}[b.status];
  var cls={new:'t-new',confirmed:'t-conf',done:'t-done',canceled:'t-can'}[b.status];
  return '<span class="tag '+cls+'">'+st+'</span>'+(b.paid?' <span class="tag t-paid">оплачено онлайн (демо)</span>':'');
}
function specBookings(db,id){
  return db.bookings.filter(function(b){return b.specId===id;}).sort(function(a,b){return (a.date+a.time<b.date+b.time)?-1:1;});
}

function renderTabs(){
  var t=document.getElementById('tabs');
  if(meAdmin){
    var db=loadDB();
    t.innerHTML='<button class="tab'+(curTab==='specs'?' act':'')+'" onclick="curTab=\'specs\';renderTabs();renderTab()">Специалисты</button>'
      +'<button class="tab'+(curTab==='pend'?' act':'')+'" onclick="curTab=\'pend\';renderTabs();renderTab()">Заявки'+(db.pending.length?' <span class="badge">'+db.pending.length+'</span>':'')+'</button>'
      +'<button class="tab'+(curTab==='all'?' act':'')+'" onclick="curTab=\'all\';renderTabs();renderTab()">Все записи</button>';
    return;
  }
  if(!me)return;
  var db=loadDB();
  var fresh=specBookings(db,me.id).filter(function(b){return b.status==='new'&&db.seen.indexOf(b.id)<0;}).length;
  t.innerHTML='<button class="tab'+(curTab==='bk'?' act':'')+'" onclick="curTab=\'bk\';markSeen();renderTabs();renderTab()">Записи'+(fresh?' <span class="badge">'+fresh+'</span>':'')+'</button>'
    +'<button class="tab'+(curTab==='prof'?' act':'')+'" onclick="curTab=\'prof\';renderTabs();renderTab()">Профиль</button>'
    +'<button class="tab'+(curTab==='svc'?' act':'')+'" onclick="curTab=\'svc\';renderTabs();renderTab()">Услуги</button>';
}
function markSeen(){
  var db=loadDB();
  specBookings(db,me.id).forEach(function(b){if(db.seen.indexOf(b.id)<0)db.seen.push(b.id);});
  saveDB(db);
}

function renderTab(){
  if(meAdmin)return renderAdmin();
  if(!me)return;
  var box=document.getElementById('content');
  var db=loadDB();
  me=specById(db,me.id)||me;
  if(curTab==='bk'){
    var list=specBookings(db,me.id);
    if(!list.length){box.innerHTML='<div class="card"><b>Записей пока нет.</b><p class="mut">Когда клиент запишется с сайта, запись появится здесь — нажми «Обновить», если сайт открыт в соседней вкладке.</p></div>';return;}
    box.innerHTML=list.map(function(b){
      var btn='';
      if(b.status==='new')btn='<button onclick="setSt(\''+b.id+'\',\'confirmed\')">Подтвердить</button>';
      if(b.status==='confirmed')btn='<button onclick="setSt(\''+b.id+'\',\'done\')">Завершить</button><button class="sec" onclick="setSt(\''+b.id+'\',\'canceled\')">Отменить</button>';
      return '<div class="bk"><div class="bktop"><b>'+b.date+' в '+b.time+'</b>'+statusTag(b)+'</div>'
        +'<div class="mut">'+esc(b.service)+' • '+esc(b.name)+' • '+esc(b.phone)+'</div>'
        +'<div class="row">'+btn+'</div></div>';
    }).join('');
  }
  else if(curTab==='prof'){
    var days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    box.innerHTML='<div class="card"><h1>Профиль</h1>'
      +'<label>Имя</label><input id="pName" value="'+esc(me.name)+'">'
      +'<label>Город</label><select id="pCity">'+['Назрань','Магас','Карабулак'].map(function(c){return '<option'+(me.city===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select>'
      +'<label>Телефон</label><input id="pPhone" value="'+esc(me.phone)+'">'
      +'<label>Рабочие дни (клиенты видят слоты только в эти дни)</label><div class="chk">'+days.map(function(d,i){return '<label><input type="checkbox" '+(me.days.indexOf(i)>=0?'checked':'')+' onchange="tglDay('+i+')"> '+d+'</label>';}).join('')+'</div>'
      +'<label>Новый пароль (необязательно)</label><input id="pPass" type="password" placeholder="Оставь пустым, чтобы не менять">'
      +'<button class="big" style="margin-top:12px" onclick="saveProf()">Сохранить профиль</button><div class="err" id="pErr"></div></div>';
  }
  else if(curTab==='svc'){
    box.innerHTML='<div class="card"><h1>Мои услуги</h1><p class="mut">Клиент видит эти услуги и цены «от — до» в карточке мастера.</p><div id="svcList" style="margin-top:10px"></div>'
      +'<button class="big sec" style="margin-top:8px" onclick="addSvc()">+ Добавить услугу</button>'
      +'<button class="big" style="margin-top:8px" onclick="saveSvc()">Сохранить услуги</button><div class="err" id="sErr"></div></div>';
    drawSvc(db);
  }
}
function setSt(id,st){
  var db=loadDB();
  db.bookings.forEach(function(b){if(b.id===id)b.status=st;});
  saveDB(db);renderTab();renderTabs();
}
function tglDay(i){
  var db=loadDB();me=specById(db,me.id);
  var p=me.days.indexOf(i);
  if(p>=0)me.days.splice(p,1);else me.days.push(i);
  saveDB(db);
}
function saveProf(){
  var db=loadDB();me=specById(db,me.id);
  me.name=document.getElementById('pName').value.trim()||me.name;
  me.city=document.getElementById('pCity').value;
  me.phone=document.getElementById('pPhone').value.trim();
  var np=document.getElementById('pPass').value.trim();
  var err=document.getElementById('pErr');err.style.display='none';
  if(np){
    if(np.length<4){err.textContent='Пароль минимум 4 символа';err.style.display='block';return;}
    me.pass=np;
  }
  saveDB(db);
  err.style.color='var(--ok)';err.textContent='Профиль сохранён ✓';err.style.display='block';
}
function drawSvc(db){
  document.getElementById('svcList').innerHTML=me.services.map(function(s,i){
    return '<div class="svcrow"><input id="sn'+i+'" value="'+esc(s.n)+'"><input id="sp1_'+i+'" type="number" value="'+s.p1+'"><input id="sp2_'+i+'" type="number" value="'+s.p2+'"><button class="sec" onclick="delSvc('+i+')">✕</button></div>';
  }).join('');
}
function addSvc(){me.services.push({n:'Новая услуга',p1:500,p2:1000});var db=loadDB();saveDB(db);renderTab();}
function delSvc(i){me.services.splice(i,1);var db=loadDB();saveDB(db);renderTab();}
function saveSvc(){
  var db=loadDB();me=specById(db,me.id);
  var err=document.getElementById('sErr');err.style.display='none';
  for(var i=0;i<me.services.length;i++){
    var n=document.getElementById('sn'+i).value.trim();
    var a=parseInt(document.getElementById('sp1_'+i).value)||0;
    var b=parseInt(document.getElementById('sp2_'+i).value)||0;
    if(!n){err.textContent='У услуги №'+(i+1)+' нет названия';err.style.display='block';return;}
    if(b<a)b=a;
    me.services[i]={n:n,p1:a,p2:b};
  }
  saveDB(db);
  err.style.color='var(--ok)';err.textContent='Услуги сохранены ✓';err.style.display='block';
}

function renderAdmin(){
  var box=document.getElementById('content');
  var db=loadDB();
  if(curTab==='specs'){
    box.innerHTML='<div class="card"><h1>Специалисты ('+db.specialists.length+')</h1><p class="mut">Все мастера платформы: контакты, статистика записей и рейтинг.</p></div>'
      +db.specialists.map(function(sp){
        var list=specBookings(db,sp.id);
        var nNew=list.filter(function(b){return b.status==='new';}).length;
        var nDone=list.filter(function(b){return b.status==='done';}).length;
        var rs=db.reviews.filter(function(r){return r.specId===sp.id;});
        var r=sp.rating,v=sp.votes;
        if(rs.length){var sum=0;rs.forEach(function(x){sum+=x.stars;});r=(sum+sp.rating*sp.votes)/(rs.length+sp.votes);v=sp.votes+rs.length;}
        return '<div class="bk"><div class="bktop"><b>'+esc(sp.name)+'</b><span class="mut">★ '+r.toFixed(1)+' ('+v+')</span></div>'
          +'<div class="mut">'+esc(sp.cat)+' • '+esc(sp.city)+' • '+esc(sp.phone)+' • услуг: '+sp.services.length+' • пароль: '+sp.pass+'</div>'
          +'<div class="stat3"><div><b>'+list.length+'</b><span>всего записей</span></div><div><b>'+nNew+'</b><span>новых</span></div><div><b>'+nDone+'</b><span>завершённых</span></div></div>'
          +'<div class="row"><button class="sec" onclick="showSpecBk(\''+sp.id+'\')">Показать записи</button><button class="sec" onclick="delSpec(\''+sp.id+'\')">Удалить мастера</button></div>'
          +'<div id="l_'+sp.id+'"></div></div>';
      }).join('');
  }
  else if(curTab==='pend'){
    if(!db.pending.length){box.innerHTML='<div class="card"><b>Новых заявок нет.</b><p class="mut">Заявки мастеров приходят с клиентского сайта, раздел «Стать мастером».</p></div>';return;}
    box.innerHTML='<div class="card"><h1>Заявки на регистрацию ('+db.pending.length+')</h1></div>'+db.pending.map(function(p){
      return '<div class="bk"><div class="bktop"><b>'+esc(p.name)+'</b><span class="tag t-new">новая</span></div>'
        +'<div class="mut">'+esc(p.cat)+' • '+esc(p.city)+' • '+esc(p.phone)+'<br>Услуги: '+esc(p.services)+'</div>'
        +'<div class="row"><button onclick="approve(\''+p.id+'\')">Одобрить</button><button class="sec" onclick="reject(\''+p.id+'\')">Отклонить</button></div></div>';
    }).join('');
  }
  else if(curTab==='all'){
    if(!db.bookings.length){box.innerHTML='<div class="card"><b>Записей пока нет.</b><p class="mut">Сделай тестовую запись на клиентском сайте — она появится здесь.</p></div>';return;}
    var sorted=db.bookings.slice().sort(function(a,b){return b.created-a.created;});
    box.innerHTML='<div class="card"><h1>Все записи ('+sorted.length+')</h1><div style="overflow-x:auto"><table><tr><th>Дата</th><th>Время</th><th>Мастер</th><th>Клиент</th><th>Услуга</th><th>Статус</th></tr>'
      +sorted.map(function(b){
        var sp=null;db.specialists.forEach(function(s){if(s.id===b.specId)sp=s;});
        return '<tr><td>'+b.date+'</td><td>'+b.time+'</td><td>'+esc(sp?sp.name:'—')+'</td><td>'+esc(b.name)+'<br><span class="mut">'+esc(b.phone)+'</span></td><td>'+esc(b.service)+'</td><td>'+statusTag(b)+'</td></tr>';
      }).join('')+'</table></div></div>';
  }
}
function showSpecBk(id){
  var db=loadDB();var list=specBookings(db,id);
  var el=document.getElementById('l_'+id);
  if(el.dataset.open==='1'){el.innerHTML='';el.dataset.open='0';return;}
  el.dataset.open='1';
  el.innerHTML=list.length?'<div style="margin-top:10px">'+list.map(function(b){
    return '<div class="mut" style="padding:4px 0;border-bottom:1px solid var(--line)">'+b.date+' '+b.time+' • '+esc(b.service)+' • '+esc(b.name)+' • '+statusTag(b)+'</div>';
  }).join('')+'</div>':'<div class="mut" style="margin-top:10px">Записей пока нет</div>';
}
function delSpec(id){
  if(!confirm('Удалить мастера и все его записи?'))return;
  var db=loadDB();
  db.specialists=db.specialists.filter(function(s){return s.id!==id;});
  db.bookings=db.bookings.filter(function(b){return b.specId!==id;});
  saveDB(db);renderTab();
}
function approve(id){
  var db=loadDB();var p=null;
  db.pending=db.pending.filter(function(x){if(x.id===id){p=x;return false;}return true;});
  if(!p)return;
  db.specialists.push({id:'s'+Date.now(),name:p.name,cat:p.cat,city:p.city,phone:p.phone,rating:5.0,votes:0,pass:'0000',days:[1,2,3,4,5,6],services:p.services.split(',').map(function(s){return {n:s.trim(),p1:500,p2:1000};})});
  saveDB(db);renderTab();renderTabs();
}
function reject(id){
  var db=loadDB();
  db.pending=db.pending.filter(function(x){return x.id!==id;});
  saveDB(db);renderTab();renderTabs();
}

fillAccounts();
</script>
</body>
</html>
